<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>♥</title>
<style>
:root{--bg:#030203;--red:#9a0014;--blood:#5a000c;--ice:#3d6b73;--fg:#b9aeb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
font-family:"Courier New",ui-monospace,Menlo,monospace;-webkit-text-size-adjust:100%}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scan{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.45) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,#000 95%)}
.stage{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center}
.hw{position:relative;width:min(74vw,340px);aspect-ratio:1/1;-webkit-animation:hb 2.4s infinite;animation:hb 2.4s infinite}
.hw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.main{filter:saturate(.8) brightness(.82) drop-shadow(0 0 26px rgba(154,0,20,.5))}
.g1{filter:grayscale(1) sepia(1) hue-rotate(150deg) saturate(1.6) brightness(.6)}
.g2{filter:sepia(1) hue-rotate(-35deg) saturate(3) brightness(.4)}
.g1,.g2{mix-blend-mode:screen;opacity:.8}
.g1{-webkit-animation:s1 1.1s steps(2) infinite;animation:s1 1.1s steps(2) infinite}
.g2{-webkit-animation:s2 1.7s steps(2) infinite;animation:s2 1.7s steps(2) infinite}
@keyframes hb{0%{transform:scale(1)}8%{transform:scale(1.1)}16%{transform:scale(.98)}26%{transform:scale(1.07)}40%,100%{transform:scale(1)}}
@keyframes s1{0%{clip-path:inset(12% 0 72% 0);transform:translate(-9px,0)}25%{clip-path:inset(62% 0 8% 0);transform:translate(11px,0)}
50%{clip-path:inset(35% 0 45% 0);transform:translate(-5px,0)}75%{clip-path:inset(85% 0 0 0);transform:translate(7px,0)}100%{clip-path:inset(0 0 92% 0);transform:translate(-10px,0)}}
@keyframes s2{0%{clip-path:inset(52% 0 22% 0);transform:translate(8px,0)}30%{clip-path:inset(4% 0 82% 0);transform:translate(-10px,0)}
60%{clip-path:inset(72% 0 4% 0);transform:translate(5px,0)}100%{clip-path:inset(24% 0 52% 0);transform:translate(-7px,0)}}
.hint{position:fixed;left:0;right:0;bottom:max(36px,calc(env(safe-area-inset-bottom) + 24px));z-index:6;text-align:center;font-size:12px;letter-spacing:6px;
color:#6b5459;text-transform:uppercase;-webkit-animation:fl 3s steps(1) infinite;animation:fl 3s steps(1) infinite;pointer-events:none}
@keyframes fl{0%{opacity:.9}48%{opacity:.9}50%{opacity:.1}52%{opacity:.8}70%{opacity:.2}100%{opacity:.9}}
.flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#6b0010;opacity:0}
body.hit .hw{-webkit-animation:hit .16s infinite;animation:hit .16s infinite}
@keyframes hit{0%{transform:translate(3px,1px) scale(1.04)}50%{transform:translate(-4px,-2px) scale(.98)}100%{transform:translate(2px,3px) scale(1.06)}}
</style>
</head>

<div class="hint" id="hint">коснись</div>

<script>
var $=function(i){return document.getElementById(i)};
// ===== фон: пепел, шум, редкие помехи =====
var cv=$("c"),cx=cv.getContext("2d"),W,H,D,intense=0;
function rs(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
rs();addEventListener("resize",rs);
var CH=["†","♥","·","·","✖","·"],COL=["#5a000c","#3a3235","#2a4a50","#7a0010"],parts=[];
function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:-20,s:8+Math.random()*22,v:.25+Math.random()*1.1,
c:COL[Math.random()*COL.length|0],ch:CH[Math.random()*CH.length|0],o:.25+Math.random()*.35}}
for(var i=0;i<34;i++)parts.push(mk(true));
function frame(){
  cx.fillStyle="rgba(3,2,3,"+(intense?.25:.4)+")";cx.fillRect(0,0,W,H);
  var k=1+intense*2.5;
  for(var i=0;i<parts.length;i++){var p=parts[i];p.y+=p.v*k;p.x+=Math.sin((p.y+i*13)/55)*.5;
    cx.font=p.s+"px monospace";cx.fillStyle=p.c;cx.globalAlpha=p.o;cx.fillText(p.ch,p.x,p.y);
    if(p.y>H+30)parts[i]=mk(false)}
  var n=(Math.random()<.22?1:0)+(intense?3:0);
  for(var j=0;j<n;j++){cx.fillStyle=Math.random()<.5?"#5a000c":"#2a4a50";cx.globalAlpha=.1+Math.random()*.2;
    cx.fillRect(Math.random()*W*.4,Math.random()*H,W*(.3+Math.random()*.7),1+Math.random()*(intense?28:8))}
  cx.globalAlpha=1;
  for(var m=0;m<(intense?140:45);m++){cx.fillStyle=Math.random()<.6?"#151012":"#3a0008";cx.fillRect(Math.random()*W,Math.random()*H,2,2)}
  requestAnimationFrame(frame)}
frame();

// ===== без музыки: только визуал =====
var on=false;
function pulse(a){var f=$("fl");f.style.opacity=a;setTimeout(function(){f.style.opacity=0},70)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toggle(){
  if(!on){on=true;intense=1;pulse(.4);document.body.classList.add("hit");
    setTimeout(function(){document.body.classList.remove("hit")},600);vib([80,60,80]);$("hint").style.display="none"}
  else{on=false;intense=0;$("hint").style.display="";$("hint").textContent="ещё"}}
$("st").addEventListener("click",toggle);
$("hint").addEventListener("click",toggle);
document.addEventListener("gesturestart",function(e){e.preventDefault()});
document.addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});
</script>
